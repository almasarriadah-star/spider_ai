# ═══════════════════════════════════════════════════════════════
#  إعدادات مشروع التحليل الذكي (spider_ai) — على اللابتوب
#  كل القيم قابلة للتعديل بدون لمس الكود.
#  IP الروبوت (الراسبيري) يتغيّر كثيراً → عدّله هنا أو من الشريط
#  الجانبي بالداشبورد أو عبر متغيّر البيئة SPIDER_ROBOT_IP.
# ═══════════════════════════════════════════════════════════════

robot:
  ip: "192.168.1.50"     # ← غيّر حسب IP الراسبيري على شبكتك (ابحث: hostname -I على الراسبيري)
  port: 5000             # ثابت عادةً (سيرفر Flask)
  timeout_s: 3.0

collector:
  poll_interval_s: 2.0
  skip_estimated_gps: true   # تجاهُل العينات بموقع تقديري/محاكاة (estimated=true) — لا تُخزَّن
  save_frames: true          # حفظ صورة كل عيّنة على القرص

grid:
  cell_size_m: 3.0           # حجم خلية الشبكة بالمتر (يناسب GPS عادي بدقّة 2–5م)

# درجة الجفاف قابلة للتوسيع: الآن تعتمد على اللون فقط (حسب طلبك).
# لاحقاً فعِّل soil/thermal بزيادة وزنهما — كلاهما متوفّر بالـ API جاهزاً.
drought:
  weights:
    color: 1.0
    soil: 0.0
    thermal: 0.0
  irrigate_threshold: 0.45   # drought_score ≥ هذا → "يحتاج ري"
  dry_threshold: 0.65        # drought_score ≥ هذا → "جاف"

vision:
  exg_threshold: 0.10        # عتبة مؤشّر الخضرة (ExG منوّن) لكشف الغطاء النباتي
  yolo:
    enabled: false           # المرحلة 2: فعّلها بعد تدريب نموذج الأعشاب
    model_path: "models/weeds.pt"
    conf: 0.35

storage:
  db_path: "data/spider_ai.db"
  frames_dir: "data/frames"
